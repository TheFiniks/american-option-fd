name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        numba: [false]
        include:
          # the JIT path of the PSOR / Brennan–Schwartz kernels
          - python-version: "3.12"
            numba: true
    name: py${{ matrix.python-version }}${{ matrix.numba && ' + numba' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install numba
        if: matrix.numba
        run: pip install -e ".[fast]"
      - name: Check which kernels are used
        run: python -c "import americanfd.lcp as l; print('numba JIT:', l.HAVE_NUMBA)"
      - name: Run tests
        run: pytest
